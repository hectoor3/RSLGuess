
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسيرة لاعب | روشنيات</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="style.css">

    
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-B7DMKMZ108"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-B7DMKMZ108');
</script>


</head>
<body>

    <header class="topbar">
        <div class="header-content">
            <div class="logo">روشنيات</div>
            <a href="../" class="home-button" title="الرئيسية">🏠</a>

            
        <button id="statsBtn" class="header-stats-btn" 
        type="button" title="الإحصائيات" aria-label="الإحصائيات">
          📊
        </button>

        </div>
    </header>

    <main class="game-container">

        <div class="game-heading">
            <h1>مسيرة لاعب</h1>
            <p>خمّن اللاعب من خلال الأندية التي مثّلها</p>
            <span id="challengeNumber">التحدي #001</span>
        </div>




<div id="statsModal" class="stats-modal" hidden>
    <div class="stats-box">
        <button id="closeStatsBtn" class="stats-close" type="button">✕</button>

        <h2>📊 إحصائياتك</h2>

        <div class="stats-grid">
            <div class="stat-item">
                <strong id="statPlayed">0</strong>
                <span>التحديات</span>
            </div>
            <div class="stat-item">
                <strong id="statWins">0</strong>
                <span>مرات الفوز</span>
            </div>
            <div class="stat-item">
                <strong id="statWinRate">0%</strong>
                <span>نسبة الفوز</span>
            </div>
            <div class="stat-item">
                <strong id="statTotalScore">0</strong>
                <span>مجموع النقاط</span>
            </div>
            <div class="stat-item">
                <strong id="statCurrentStreak">0</strong>
                <span>السلسلة الحالية</span>
            </div>
            <div class="stat-item">
                <strong id="statBestStreak">0</strong>
                <span>أطول سلسلة</span>
            </div>
        </div>
    </div>
</div>


        <section class="career-card">
            <div id="careerPath" class="career-path">
                <!-- شعارات الأندية والأسهم تظهر هنا -->
            </div>
        </section>

        <section class="game-status">
            <div class="score">
                النقاط: <strong id="score">10</strong> / 10
            </div>
            <div class="attempts" id="attempts">
                المحاولات المتبقية: 5
            </div>
        </section>

        <section class="guess-section">
            <input
                type="text"
                id="playerInput"
                placeholder="اكتب اسم اللاعب..."
                autocomplete="off"
            >
            <div id="suggestions" class="suggestions"></div>
            <button id="guessBtn">تخمين</button>
        </section>

        <div id="guessHistory" class="guess-history"></div>

        <section id="resultCard" class="result-card" hidden>
            <h2 id="resultTitle"></h2>
            <p id="resultDescription"></p>
            <button id="shareBtn">مشاركة النتيجة</button>
        </section>

    </main>

    <script src="players.js"></script>
    <script src="script.js"></script>
</body>
</html>
